version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    ports:
      - "3305:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    # image: game/begame
    restart: always
    ports:
      - "5001:5001"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/beltgedu
      - DB_USERNAME=root
      - DB_PASSWORD=Tandat1xxx
    depends_on:
      - mysql


volumes:
  mysql_data:
  certbot-ssl:
  certbot-challenge: