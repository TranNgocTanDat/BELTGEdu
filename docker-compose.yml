version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    ports:
      - "3305:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    # image: game/begame
    restart: always
    ports:
      - "5001:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/beltgedu
      - DB_USERNAME=root
      - DB_PASSWORD=Tandat1xxx
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
    depends_on:
      - mysql


volumes:
  mysql_data:
  certbot-ssl:
  certbot-challenge: